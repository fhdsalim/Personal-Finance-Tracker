
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My Finance Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #203047;
    }

    header {
      background: #153e35;
      color: white;
      padding: 24px;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 14px #0000000a;
    }

    .login {
      max-width: 420px;
      margin: 50px auto;
    }

    input, select, button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #d8dfe5;
      font-size: 15px;
    }

    button {
      background: #167b60;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover { background: #105b47; }

    .secondary { background: #526579; }
    .hidden { display: none !important; }
    .muted { color: #697789; }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .balance {
      font-size: 26px;
      font-weight: bold;
      color: #167b60;
    }

    .message {
      white-space: pre-wrap;
      margin-bottom: 15px;
    }

    .error { color: #b42318; }
    .success { color: #167b60; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar button {
      width: auto;
      padding: 10px 18px;
    }
  </style>
</head>

<body>
  <header>
    <h1>My Finance Tracker</h1>
    <div>Qatar & India | Personal Finance</div>
  </header>

  <main>
    <div id="message" class="message"
         role="status"></div>

    <!-- LOGIN PAGE -->
    <section id="loginSection"
             class="card login hidden">

      <h2>Welcome Back</h2>
      <p class="muted">
        Sign in to manage your finances.
      </p>

      <form id="loginForm">
        <input
          id="email"
          type="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          minlength="8"
          required
        >

        <button type="submit">
          Sign In
        </button>
      </form>

      <button id="signupBtn" class="secondary">
        Create Account
      </button>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" class="hidden">

      <div class="card">
        <div class="topbar">
          <h2>My Dashboard</h2>
          <button id="logoutBtn"
                  class="secondary">
            Sign Out
          </button>
        </div>

        <p class="muted" id="userEmail"></p>

        <h3>My Bank Accounts</h3>
        <p class="muted">
          Opening balances in original currencies.
        </p>

        <div id="accountList" class="grid">
        </div>
      </div>

      <!-- ADD ACCOUNT -->
      <div class="card">
        <h2>Add Bank Account</h2>

        <form id="accountForm">
          <label for="accountName">
            Account Name
          </label>
          <input
            id="accountName"
            placeholder="e.g. Qatar Savings"
            maxlength="80"
            required
          >

          <label for="country">Country</label>
          <select id="country">
            <option value="Qatar">Qatar</option>
            <option value="India">India</option>
          </select>

          <label for="currency">Currency</label>
          <select id="currency">
            <option value="QAR">QAR</option>
            <option value="INR">INR</option>
          </select>

          <label for="accountType">
            Account Type
          </label>
          <select id="accountType">
            <option value="Bank">Bank</option>
            <option value="Savings">Savings</option>
            <option value="Cash">Cash</option>
          </select>

          <label for="openingBalance">
            Opening Balance
          </label>
          <input
            id="openingBalance"
            type="number"
            step="0.01"
            min="0"
            placeholder="0.00"
            required
          >

          <button type="submit">
            Add Account
          </button>
        </form>
      </div>
    </section>
  </main>

  <script>
    // REPLACE WITH YOUR OWN SUPABASE DETAILS
    const SUPABASE_URL = "https://iaamydiemgwgwmlufuya.supabase.co/rest/v1/";
    const SUPABASE_KEY =
      "sb_publishable_vZcJLWK4f83wdCpBOOzrOQ_iQ9_xgv5";

    const $ = id => document.getElementById(id);

    function showMessage(text, isError = false) {
      const el = $("message");
      el.textContent = text;
      el.className = isError
        ? "message error"
        : "message success";
    }

    if (
      SUPABASE_URL === "YOUR_SUPABASE_URL" ||
      SUPABASE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
    ) {
      showMessage(
        "Please add your Supabase URL and publishable key.",
        true
      );
    } else {
      startApp();
    }

    function startApp() {
      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      async function checkLogin() {
        const { data, error } =
          await db.auth.getUser();

        if (error || !data.user) {
          $("loginSection").classList.remove("hidden");
          $("dashboard").classList.add("hidden");
          return;
        }

        $("loginSection").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("userEmail").textContent = data.user.email;

        await loadAccounts();
      }

      $("loginForm").addEventListener(
        "submit", async event => {
          event.preventDefault();

          const { error } =
            await db.auth.signInWithPassword({
              email: $("email").value,
              password: $("password").value
            });

          if (error) {
            showMessage(error.message, true);
            return;
          }

          showMessage("");
          await checkLogin();
        }
      );

      $("signupBtn").addEventListener(
        "click", async () => {
          const email = $("email").value;
          const password = $("password").value;

          if (!email || password.length < 8) {
            showMessage(
              "Enter your email and a password of at least 8 characters.",
              true
            );
            return;
          }

          const { error } = await db.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo:
                window.location.origin +
                window.location.pathname
            }
          });

          if (error) {
            showMessage(error.message, true);
          } else {
            showMessage(
              "Check your email to confirm your account, then sign in."
            );
          }
        }
      );

      $("logoutBtn").addEventListener(
        "click", async () => {
          const { error } = await db.auth.signOut();

          if (error) {
            showMessage(error.message, true);
            return;
          }

          showMessage("");
          await checkLogin();
        }
      );

      $("country").addEventListener(
        "change", () => {
          $("currency").value =
            $("country").value === "India"
              ? "INR"
              : "QAR";
        }
      );

      $("accountForm").addEventListener(
        "submit", async event => {
          event.preventDefault();

          const { data, error: authError } =
            await db.auth.getUser();

          if (authError || !data.user) {
            showMessage(
              "Please sign in again.",
              true
            );
            return;
          }

          const { error } = await db
            .from("accounts")
            .insert({
              user_id: data.user.id,
              name: $("accountName").value.trim(),
              country: $("country").value,
              currency: $("currency").value,
              account_type: $("accountType").value,
              opening_balance:
                Number($("openingBalance").value)
            });

          if (error) {
            showMessage(error.message, true);
            return;
          }

          $("accountForm").reset();
          showMessage("Account added successfully.");
          await loadAccounts();
        }
      );

      async function loadAccounts() {
        const list = $("accountList");
        list.replaceChildren();

        const { data, error } = await db
          .from("accounts")
          .select(
            "name,country,currency,opening_balance"
          )
          .order("created_at", {
            ascending: false
          });

        if (error) {
          showMessage(error.message, true);
          return;
        }

        if (!data.length) {
          list.textContent =
            "No accounts yet. Add your first account below.";
          return;
        }

        for (const account of data) {
          const card = document.createElement("div");
          card.className = "card";

          const name = document.createElement("h3");
          name.textContent = account.name;

          const country = document.createElement("p");
          country.className = "muted";
          country.textContent = account.country;

          const balance = document.createElement("p");
          balance.className = "balance";
          balance.textContent =
            account.currency + " " +
            Number(account.opening_balance)
              .toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              });

          card.append(name, country, balance);
          list.appendChild(card);
        }
      }

      checkLogin();
    }
  </script>
</body>
</html>

</html>
